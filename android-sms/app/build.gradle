apply plugin: 'com.android.application'

// TRU SMS: sends TRU Data's text messages from this phone's SIM.
// No libraries: only the Android SDK, so it builds anywhere (AIDE included).
android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.trudata.sms"
        minSdkVersion 21
        targetSdkVersion 29
        // Raise both for every new APK.
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
}
