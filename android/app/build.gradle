apply plugin: 'com.android.application'

android {
    namespace 'com.trudata.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.trudata.app"
        minSdk 21
        // Same behaviour as before; raise later with care.
        targetSdk 29
        // Raise both for every new APK.
        versionCode 25
        versionName "2.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Lint would stop a release build because targetSdk is older than the
    // Play Store minimum; this APK is installed directly, so build anyway.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.3.2'
    // Stay on 19.x: the app uses InterstitialAd.isLoaded(), removed in 20.0.
    implementation 'com.google.android.gms:play-services-ads:19.7.0'
}
