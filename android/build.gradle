apply plugin: 'com.android.application'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.trudata.app"
        minSdkVersion 21
        targetSdkVersion 29
        // Must be higher than the installed app's for the update to install.
        // Raise both every time you publish a new APK.
        versionCode 20
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core:1.3.2'
    // Keep at 19.x: MainActivity uses InterstitialAd.isLoaded(), which 20.0 removed.
    implementation 'com.google.android.gms:play-services-ads:19.7.0'
}
